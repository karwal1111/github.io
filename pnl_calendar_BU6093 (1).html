<head>

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#fff;color:#222;min-height:100vh}
.page{max-width:1200px;margin:0 auto;padding:32px 28px}

/* Header */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;flex-wrap:wrap;gap:12px}
.header-left h1{font-size:17px;font-weight:600;color:#1a1a1a}
.header-left .sub{font-size:12px;color:#888;margin-top:3px}
.header-right{display:flex;align-items:center;gap:10px;font-size:12px;color:#888}
.date-range{display:flex;align-items:center;gap:5px;font-size:12px;color:#666;background:#f6f6f6;padding:6px 12px;border-radius:20px;border:1px solid #eee}

/* Year tabs */
.year-tabs{display:flex;gap:6px;margin-bottom:20px}
.ytab{font-size:12px;font-weight:500;padding:5px 14px;border-radius:20px;cursor:pointer;border:1px solid #e0e0e0;background:#fff;color:#888;transition:all .14s}
.ytab.on{background:#387ed1;color:#fff;border-color:#387ed1}

/* Calendar */
.cal-outer{overflow-x:auto;padding-bottom:8px;margin-bottom:28px}
.cal{display:flex;gap:20px;min-width:max-content;align-items:flex-start}
.month-block{display:flex;flex-direction:column;align-items:center;gap:0}
.month-label{font-size:11px;font-weight:600;color:#aaa;text-transform:uppercase;letter-spacing:.5px;margin-top:10px;text-align:center}
.week-grid{display:grid;grid-template-columns:repeat(5,18px);grid-auto-rows:18px;gap:3px;padding:2px 0}
.day-cell{width:18px;height:18px;border-radius:3px;cursor:pointer;transition:transform .1s,box-shadow .1s;position:relative}
.day-cell:hover{transform:scale(1.25);z-index:10}
.day-cell.empty{background:transparent;cursor:default;pointer-events:none}
.day-cell.no-trade{background:#f0f0f0}
.day-cell.profit-1{background:#c8e6c9}
.day-cell.profit-2{background:#81c784}
.day-cell.profit-3{background:#43a047}
.day-cell.profit-4{background:#1b5e20}
.day-cell.loss-1{background:#ffcdd2}
.day-cell.loss-2{background:#e57373}
.day-cell.loss-3{background:#e53935}
.day-cell.loss-4{background:#7f0000}
.day-cell.selected{outline:2.5px solid #1a73e8;outline-offset:1px}

/* Tooltip */
.tip{position:fixed;background:#1a1a1a;color:#fff;padding:10px 13px;border-radius:8px;font-size:12px;pointer-events:none;z-index:999;display:none;min-width:170px;line-height:1.7;box-shadow:0 4px 16px rgba(0,0,0,.25)}
.tip-date{font-size:10px;color:#aaa;margin-bottom:3px}
.tip-pnl{font-size:15px;font-weight:700}
.tip-pos{color:#69e07a}.tip-neg{color:#ff7070}
.tip-cnt{font-size:11px;color:#ccc;margin-top:2px}

/* Summary strip */
.summary{display:flex;gap:0;border:1px solid #eee;border-radius:10px;overflow:hidden;margin-bottom:24px;background:#fff}
.sum-item{flex:1;padding:20px 22px;border-right:1px solid #eee;text-align:left}
.sum-item:last-child{border-right:none}
.sum-lbl{font-size:12px;color:#888;margin-bottom:6px}
.sum-val{font-size:22px;font-weight:600;letter-spacing:-.4px}
.sum-pos{color:#2e7d32}.sum-neg{color:#c62828}.sum-neu{color:#333}

/* Monthly bar chart */
.month-bars{margin-bottom:24px}
.mbars-title{font-size:12px;font-weight:600;color:#888;text-transform:uppercase;letter-spacing:.5px;margin-bottom:12px}
.mbar-row{display:flex;align-items:center;gap:10px;margin-bottom:7px}
.mbar-label{font-size:11px;color:#666;width:36px;text-align:right;flex-shrink:0}
.mbar-track{flex:1;height:22px;background:#f5f5f5;border-radius:4px;overflow:hidden;position:relative}
.mbar-fill{height:100%;border-radius:4px;transition:width .3s}
.mbar-val{font-size:11px;font-weight:600;width:80px;text-align:right;flex-shrink:0}

/* Day detail panel */
.detail-panel{background:#f8f9fc;border:1px solid #e8eaee;border-radius:10px;padding:18px 20px;display:none;margin-bottom:18px}
.detail-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.detail-date{font-size:14px;font-weight:600}
.detail-close{cursor:pointer;font-size:18px;color:#aaa;line-height:1;padding:2px 6px;border-radius:4px}
.detail-close:hover{background:#eee}
.detail-pnl{font-size:28px;font-weight:700;margin-bottom:12px}
.detail-trades{font-size:12px;color:#666;overflow-x:auto}
.dtable{width:100%;border-collapse:collapse;font-size:12px;min-width:520px}
.dtable th{padding:7px 10px;text-align:left;font-size:10px;font-weight:600;color:#999;border-bottom:1px solid #e8eaee;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap}
.dtable td{padding:7px 10px;border-bottom:1px solid #f0f1f4;white-space:nowrap;color:#333}
.dtable tr:last-child td{border-bottom:none}
.dtable tr:hover td{background:#f0f2f8}
.dbx{font-size:10px;font-weight:700;padding:2px 6px;border-radius:3px;display:inline-block}
.dbx-b{background:#e8f5e9;color:#2e7d32}
.dbx-s{background:#ffebee;color:#c62828}
.dp{color:#2e7d32;font-weight:600}.dn{color:#c62828;font-weight:600}

/* Legend */
.legend{display:flex;align-items:center;gap:14px;font-size:11px;color:#888;margin-top:4px;flex-wrap:wrap}
.leg-row{display:flex;align-items:center;gap:4px}
.leg-sq{width:12px;height:12px;border-radius:2px;display:inline-block}

@media(max-width:700px){.summary{flex-direction:column}.sum-item{border-right:none;border-bottom:1px solid #eee}}
</style>
</head>

var MONTHS=["JAN","FEB","MAR","APR","MAY","JUN","JUL","AUG","SEP","OCT","NOV","DEC"];
var MFULL=["January","February","March","April","May","June","July","August","September","October","November","December"];

function inr(v){return Math.abs(v)<1000?(Math.abs(v)).toFixed(0):(Math.abs(v)/1000).toFixed(1)+"k";}
function sgn(v){return v>=0?"+":"-";}
function fmtDate(d){var p=d.split("-");return p[2]+" "+MFULL[+p[1]-1]+" "+p[0];}
function isWeekend(y,m,d){var day=new Date(y,m-1,d).getDay();return day===0||day===6;}
function daysInMonth(y,m){return new Date(y,m,0).getDate();}

function getCls(pnl){
  if(pnl===undefined) return "no-trade";
  var a=Math.abs(pnl);
  if(pnl>0){return a>=5000?"profit-4":a>=2000?"profit-3":a>=500?"profit-2":"profit-1";}
  else{return a>=5000?"loss-4":a>=2000?"loss-3":a>=500?"loss-2":"loss-1";}
}

function buildCal(){
  var cal=document.getElementById("cal");
  var months=[[2026,1],[2026,2],[2026,3]];
  months.forEach(function(ym){
    var y=ym[0],m=ym[1];
    var days=daysInMonth(y,m);
    var firstDow=new Date(y,m-1,1).getDay(); // 0=Sun
    // Only Mon-Fri. Map to col 0-4
    var mb=document.createElement("div");
    mb.className="month-block";
    // Build 5-col grid (Mon-Fri)
    var grid=document.createElement("div");
    grid.className="week-grid";
    // Find first Monday on or before day 1
    var cells=[];
    for(var d=1;d<=days;d++){
      var dow=new Date(y,m-1,d).getDay();
      if(dow===0||dow===6) continue; // skip weekends
      cells.push(d);
    }
    // Group by week (Mon=col0..Fri=col4)
    // We need to pad initial empty cols
    var firstCell=cells[0];
    var firstDowCell=new Date(y,m-1,firstCell).getDay(); // 1=Mon..5=Fri
    // Add empty placeholders
    for(var i=1;i<firstDowCell;i++){
      var empty=document.createElement("div");
      empty.className="day-cell empty";
      grid.appendChild(empty);
    }
    cells.forEach(function(d){
      var dt=y+"-"+String(m).padStart(2,"0")+"-"+String(d).padStart(2,"0");
      var pnl=DAILY[dt];
      var cell=document.createElement("div");
      cell.className="day-cell "+getCls(pnl);
      cell.setAttribute("data-date",dt);
      cell.setAttribute("title",dt);
      cell.addEventListener("mouseenter",showTip);
      cell.addEventListener("mouseleave",hideTip);
      cell.addEventListener("click",function(){showDetail(dt);});
      grid.appendChild(cell);
    });
    var lbl=document.createElement("div");
    lbl.className="month-label";
    lbl.textContent=MONTHS[m-1];
    mb.appendChild(grid);
    mb.appendChild(lbl);
    cal.appendChild(mb);
  });
}

function showTip(e){
  var dt=this.getAttribute("data-date");
  var pnl=DAILY[dt];
  var tc=TC[dt]||0;
  var tip=document.getElementById("tip");
  var parts=dt.split("-");
  var dname=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(dt).getDay()];
  tip.innerHTML='<div class="tip-date">'+dname+", "+fmtDate(dt)+'</div>'
    +(pnl!==undefined
      ?'<div class="tip-pnl '+(pnl>=0?"tip-pos":"tip-neg")+'">'+(pnl>=0?"+":"")+"₹"+Math.abs(pnl).toLocaleString("en-IN",{maximumFractionDigits:0})+'</div><div class="tip-cnt">'+tc+' trades executed</div>'
      :'<div style="color:#888;font-size:12px">No trades</div>');
  tip.style.display="block";
  moveTip(e);
}
function moveTip(e){
  var tip=document.getElementById("tip");
  var x=e.clientX+14, y=e.clientY-10;
  if(x+180>window.innerWidth) x=e.clientX-190;
  tip.style.left=x+"px"; tip.style.top=y+"px";
}
function hideTip(){document.getElementById("tip").style.display="none";}
document.addEventListener("mousemove",function(e){if(document.getElementById("tip").style.display==="block")moveTip(e);});

function showDetail(dt){
  document.querySelectorAll(".day-cell.selected").forEach(function(c){c.classList.remove("selected");});
  var cell=document.querySelector(".day-cell[data-date='"+dt+"']");
  if(cell) cell.classList.add("selected");
  var pnl=DAILY[dt];
  var trades=ALL_TRADES.filter(function(t){return t.date===dt;});
  var dp=document.getElementById("detail");
  var parts=dt.split("-");
  var dname=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"][new Date(dt).getDay()];
  document.getElementById("d-date").textContent=dname+", "+fmtDate(dt);
  var pnlEl=document.getElementById("d-pnl");
  pnlEl.textContent=(pnl>=0?"+":"")+"₹"+Math.abs(pnl).toLocaleString("en-IN",{maximumFractionDigits:0});
  pnlEl.style.color=pnl>=0?"#2e7d32":"#c62828";
  var html="";
  if(trades.length){
    html='<table class="dtable"><thead><tr><th>Symbol</th><th>Type</th><th>Qty</th><th>Price</th><th>P&L</th></tr></thead><tbody>';
    trades.sort(function(a,b){return b.pnl-a.pnl;});
    trades.forEach(function(t){
      html+='<tr><td style="font-weight:600;font-size:11px">'+t.symbol+'</td>'
        +'<td><span class="dbx '+(t.type==="buy"?"dbx-b":"dbx-s")+'">'+t.type.toUpperCase()+'</span></td>'
        +'<td>'+t.qty.toLocaleString("en-IN")+'</td>'
        +'<td>₹'+t.price.toFixed(2)+'</td>'
        +'<td class="'+(t.pnl>=0?"dp":"dn")+'">'+(t.pnl>=0?"+":"")+"₹"+Math.abs(t.pnl).toLocaleString("en-IN",{maximumFractionDigits:0})+'</td></tr>';
    });
    html+='</tbody></table>';
  } else {
    html='<div style="color:#aaa;padding:10px 0">No closed trades on this day.</div>';
  }
  document.getElementById("d-trades").innerHTML=html;
  dp.style.display="block";
  setTimeout(function(){dp.scrollIntoView({behavior:"smooth",block:"nearest"});},50);
}
function closeDetail(){
  document.getElementById("detail").style.display="none";
  document.querySelectorAll(".day-cell.selected").forEach(function(c){c.classList.remove("selected");});
}

function buildSummary(){
  var totalPnl=Object.values(DAILY).reduce(function(s,v){return s+v;},0);
  var profDays=Object.values(DAILY).filter(function(v){return v>0;}).length;
  var lossDays=Object.values(DAILY).filter(function(v){return v<0;}).length;
  var best=Object.entries(DAILY).reduce(function(b,e){return e[1]>b[1]?e:b;},["",- Infinity]);
  var worst=Object.entries(DAILY).reduce(function(b,e){return e[1]<b[1]?e:b;},["",Infinity]);
  var totalTrades=Object.values(TC).reduce(function(s,v){return s+v;},0);
  var charges=5945.30;
  var items=[
    {l:"Realised P&L",v:totalPnl,cls:totalPnl>=0?"sum-pos":"sum-neg",fmt:function(v){return (v>=0?"+":"-")+"₹"+Math.abs(v).toLocaleString("en-IN",{maximumFractionDigits:0});}},
    {l:"Charges & taxes",v:charges,cls:"sum-neu",fmt:function(v){return "₹"+v.toLocaleString("en-IN",{maximumFractionDigits:0});}},
    {l:"Net realised P&L",v:totalPnl-charges,cls:(totalPnl-charges)>=0?"sum-pos":"sum-neg",fmt:function(v){return (v>=0?"+":"-")+"₹"+Math.abs(v).toLocaleString("en-IN",{maximumFractionDigits:0});}},
    {l:"Profit days",v:profDays,cls:"sum-pos",fmt:function(v){return v+" days";}},
    {l:"Loss days",v:lossDays,cls:"sum-neg",fmt:function(v){return v+" days";}},
    {l:"Total orders",v:totalTrades,cls:"sum-neu",fmt:function(v){return v+" trades";}}
  ];
  var el=document.getElementById("summary");
  el.innerHTML=items.map(function(item){
    return '<div class="sum-item"><div class="sum-lbl">'+item.l+'</div><div class="sum-val '+item.cls+'">'+item.fmt(item.v)+'</div></div>';
  }).join("");
}

function buildMonthBars(){
  var monthPnl={};
  Object.entries(DAILY).forEach(function(e){
    var mo=e[0].slice(0,7);
    monthPnl[mo]=(monthPnl[mo]||0)+e[1];
  });
  var entries=Object.entries(monthPnl).sort();
  var maxAbs=Math.max.apply(null,entries.map(function(e){return Math.abs(e[1]);}));
  var html="";
  entries.forEach(function(e){
    var mo=e[0], pnl=e[1];
    var p=mo.split("-");
    var lbl=MONTHS[+p[1]-1]+" "+p[0].slice(2);
    var w=Math.abs(pnl)/maxAbs*100;
    var col=pnl>=0?"#43a047":"#e53935";
    var valStr=(pnl>=0?"+":"-")+"₹"+Math.abs(pnl).toLocaleString("en-IN",{maximumFractionDigits:0});
    html+='<div class="mbar-row">'
      +'<div class="mbar-label">'+lbl+'</div>'
      +'<div class="mbar-track"><div class="mbar-fill" style="width:'+w.toFixed(1)+'%;background:'+col+'"></div></div>'
      +'<div class="mbar-val" style="color:'+col+'">'+valStr+'</div>'
      +'</div>';
  });
  document.getElementById("mbars").innerHTML=html;
}

buildSummary();
buildCal();
buildMonthBars();
</script>
</body>
</html>
