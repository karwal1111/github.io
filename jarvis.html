<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JARVIS — AI Assistant</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Exo+2:wght@200;400;600;800&family=Share+Tech+Mono&display=swap');

:root {
  --accent: #00d4ff;
  --accent2: #0088ff;
  --danger: #ff4444;
  --gold: #ffcc00;
  --bg: #020c14;
  --panel: #040f1a;
  --border: #0a3a5a;
  --text: #c8e8f8;
  --muted: #3a6a8a;
}

* { margin:0; padding:0; box-sizing:border-box; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Exo 2', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Animated background ── */
#bgCanvas {
  position: fixed; inset: 0; z-index: 0; opacity: 0.4;
}

#app { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }

/* ── Header ── */
header {
  width: 100%; max-width: 960px;
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 0; margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.logo { font-size: 28px; font-weight: 800; letter-spacing: 8px; color: var(--accent); text-shadow: 0 0 20px var(--accent); }
.logo span { color: #fff; }
#clock { font-family: 'Share Tech Mono', monospace; font-size: 13px; color: var(--muted); text-align: right; line-height: 1.6; }

/* ── Orb ── */
#orbWrap {
  position: relative; width: 180px; height: 180px;
  display: flex; align-items: center; justify-content: center;
  margin: 10px 0 24px;
}
#orb {
  width: 130px; height: 130px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #0af4ff33, #001830);
  border: 1.5px solid var(--accent);
  box-shadow: 0 0 30px #00d4ff44, 0 0 60px #0088ff22, inset 0 0 30px #00aaff11;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer; transition: all .3s; position: relative; z-index: 2;
}
#orb:hover { box-shadow: 0 0 50px #00d4ff88, 0 0 100px #0088ff44; transform: scale(1.05); }
#orb.listening {
  border-color: var(--danger);
  box-shadow: 0 0 50px #ff444488, 0 0 100px #ff222244;
  animation: pulse-red 1s infinite;
}
#orb.thinking {
  border-color: var(--gold);
  box-shadow: 0 0 50px #ffcc0066, 0 0 100px #ffaa0033;
  animation: pulse-gold 1.2s infinite;
}
#orb.speaking {
  border-color: #00ff88;
  box-shadow: 0 0 50px #00ff8866, 0 0 100px #00ff4433;
  animation: pulse-green 0.6s infinite;
}
@keyframes pulse-red  { 0%,100%{transform:scale(1)}   50%{transform:scale(1.06)} }
@keyframes pulse-gold { 0%,100%{transform:scale(1)}   50%{transform:scale(1.04)} }
@keyframes pulse-green{ 0%,100%{transform:scale(1)}   50%{transform:scale(1.08)} }

.ring {
  position: absolute; border-radius: 50%;
  border: 1px solid var(--accent); opacity: 0.3;
  animation: expand 3s infinite ease-out;
}
.ring:nth-child(1){width:150px;height:150px;animation-delay:0s}
.ring:nth-child(2){width:170px;height:170px;animation-delay:1s}
.ring:nth-child(3){width:190px;height:190px;animation-delay:2s}
@keyframes expand { 0%{opacity:.3;transform:scale(.85)} 100%{opacity:0;transform:scale(1.2)} }

#orbIcon { font-size: 40px; user-select: none; }
#orbState { position: absolute; bottom: -28px; font-size: 11px; letter-spacing: 3px; color: var(--muted); text-transform: uppercase; font-family: 'Share Tech Mono', monospace; }

/* ── Input bar ── */
#inputBar {
  width: 100%; max-width: 760px;
  display: flex; gap: 10px; margin-bottom: 24px;
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 40px; padding: 8px 12px 8px 20px;
  transition: border-color .2s;
}
#inputBar:focus-within { border-color: var(--accent); box-shadow: 0 0 20px #00d4ff18; }
#textInput {
  flex: 1; background: transparent; border: none; outline: none;
  color: var(--text); font-family: 'Exo 2', sans-serif; font-size: 14px;
}
#textInput::placeholder { color: var(--muted); }
.icon-btn {
  width: 36px; height: 36px; border-radius: 50%;
  background: transparent; border: 1px solid var(--border);
  color: var(--muted); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  transition: all .2s;
}
.icon-btn:hover { border-color: var(--accent); color: var(--accent); }
#micBtn.active { background: var(--danger); border-color: var(--danger); color: #fff; animation: pulse-red 1s infinite; }
#sendBtn { background: var(--accent2); border-color: var(--accent2); color: #fff; }
#sendBtn:hover { background: var(--accent); border-color: var(--accent); }

/* ── Quick commands ── */
#quickCmds {
  display: flex; gap: 8px; flex-wrap: wrap; justify-content: center;
  max-width: 760px; margin-bottom: 24px;
}
.qbtn {
  background: var(--panel); border: 1px solid var(--border);
  border-radius: 20px; padding: 6px 14px;
  font-size: 12px; color: var(--muted); cursor: pointer;
  font-family: 'Share Tech Mono', monospace; letter-spacing: 1px;
  transition: all .2s;
}
.qbtn:hover { border-color: var(--accent); color: var(--accent); background: #001828; }

/* ── Conversation ── */
#convo {
  width: 100%; max-width: 760px;
  display: flex; flex-direction: column; gap: 16px;
  margin-bottom: 30px;
}

.msg {
  display: flex; gap: 12px; align-items: flex-start;
  animation: fadeIn .3s ease;
}
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }

.msg.user { flex-direction: row-reverse; }
.avatar {
  width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
  display: flex; align-items: center; justify-content: center;
  font-size: 15px; border: 1px solid var(--border);
}
.avatar.ai  { background: #001828; border-color: var(--accent); color: var(--accent); }
.avatar.usr { background: #180028; border-color: #8844ff; color: #8844ff; }

.bubble {
  max-width: 85%; padding: 12px 16px;
  border-radius: 16px; line-height: 1.6; font-size: 14px;
  position: relative;
}
.msg.ai .bubble {
  background: var(--panel); border: 1px solid var(--border);
  border-top-left-radius: 4px; color: var(--text);
}
.msg.user .bubble {
  background: #0c0820; border: 1px solid #331166;
  border-top-right-radius: 4px; color: #ddd;
}

/* ── Cards ── */
.cards-row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 10px; }
.card {
  background: #020f1c; border: 1px solid var(--border);
  border-radius: 10px; padding: 12px 14px; min-width: 150px; flex: 1;
}
.card .card-label { font-size: 10px; letter-spacing: 2px; color: var(--muted); margin-bottom: 4px; font-family: 'Share Tech Mono', monospace; }
.card .card-val { font-size: 22px; font-weight: 600; color: var(--accent); }
.card .card-sub { font-size: 11px; color: var(--muted); margin-top: 2px; }
.card.up .card-val   { color: #00ff88; }
.card.down .card-val { color: var(--danger); }

.news-item { padding: 8px 0; border-bottom: 1px solid var(--border); }
.news-item:last-child { border-bottom: none; }
.news-item .news-src  { font-size: 10px; letter-spacing: 2px; color: var(--muted); font-family: 'Share Tech Mono', monospace; }
.news-item .news-title{ font-size: 13px; color: var(--text); line-height: 1.4; margin-top: 3px; }

/* ── API key notice ── */
#apiNotice {
  width: 100%; max-width: 760px;
  background: #0c1a08; border: 1px solid #2a5a1a;
  border-radius: 10px; padding: 12px 16px;
  font-size: 12px; color: #88cc66; margin-bottom: 16px;
  display: none;
}
#apiKeyWrap {
  width: 100%; max-width: 760px;
  display: flex; gap: 8px; margin-bottom: 20px;
}
#apiKeyInput {
  flex: 1; background: var(--panel); border: 1px solid var(--border);
  border-radius: 8px; padding: 8px 14px; color: var(--text);
  font-family: 'Share Tech Mono', monospace; font-size: 12px; outline: none;
}
#apiKeyInput:focus { border-color: var(--accent); }
#apiKeyBtn {
  background: var(--accent2); border: none; border-radius: 8px;
  padding: 8px 18px; color: #fff; font-family: 'Exo 2', sans-serif;
  font-size: 12px; cursor: pointer; letter-spacing: 1px;
}
#apiKeyBtn:hover { background: var(--accent); }

/* ── Typing indicator ── */
.typing { display: flex; gap: 5px; align-items: center; padding: 14px 16px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); animation: blink 1.2s infinite; }
.dot:nth-child(2){animation-delay:.2s}
.dot:nth-child(3){animation-delay:.4s}
@keyframes blink { 0%,100%{opacity:.2} 50%{opacity:1} }

/* ── Status bar ── */
#statusBar {
  position: fixed; bottom: 0; left: 0; right: 0;
  background: #020c14ee; border-top: 1px solid var(--border);
  display: flex; gap: 20px; padding: 6px 24px;
  font-family: 'Share Tech Mono', monospace; font-size: 11px; color: var(--muted);
  backdrop-filter: blur(10px); z-index: 10;
}
.status-item { display: flex; gap: 6px; align-items: center; }
.dot-live { width: 6px; height: 6px; border-radius: 50%; background: #00ff88; animation: blink 2s infinite; }

/* ── Voice wave bars ── */
#voiceWave {
  display: none; gap: 3px; align-items: center; height: 30px;
  margin: 0 auto 16px;
}
#voiceWave.active { display: flex; }
.wave-bar {
  width: 4px; background: var(--accent); border-radius: 2px;
  animation: wave 0.8s ease-in-out infinite;
}
.wave-bar:nth-child(1){height:8px;animation-delay:.0s}
.wave-bar:nth-child(2){height:16px;animation-delay:.1s}
.wave-bar:nth-child(3){height:24px;animation-delay:.2s}
.wave-bar:nth-child(4){height:16px;animation-delay:.3s}
.wave-bar:nth-child(5){height:8px;animation-delay:.4s}
.wave-bar:nth-child(6){height:20px;animation-delay:.5s}
.wave-bar:nth-child(7){height:12px;animation-delay:.6s}
@keyframes wave { 0%,100%{transform:scaleY(1)} 50%{transform:scaleY(0.3)} }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<div id="app">
  <header>
    <div class="logo">J<span>ARVIS</span></div>
    <div id="clock"></div>
  </header>

  <!-- API Key Setup -->
  <div id="apiNotice">
    ✓ Claude API key saved. JARVIS is ready. Say something or type a command.
  </div>
  <div id="apiKeyWrap">
    <input id="apiKeyInput" type="password" placeholder="Enter your Anthropic API key to activate JARVIS...">
    <button id="apiKeyBtn" onclick="saveKey()">ACTIVATE</button>
  </div>

  <!-- Orb -->
  <div id="orbWrap">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
    <div id="orb" onclick="toggleMic()">
      <div id="orbIcon">🤖</div>
    </div>
    <div id="orbState">standby</div>
  </div>

  <!-- Voice wave -->
  <div id="voiceWave">
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div><div class="wave-bar"></div><div class="wave-bar"></div>
    <div class="wave-bar"></div>
  </div>

  <!-- Quick commands -->
  <div id="quickCmds">
    <div class="qbtn" onclick="ask('What is the latest breaking news?')">📰 Breaking News</div>
    <div class="qbtn" onclick="ask('What is the current weather in major cities around the world?')">🌤 Global Weather</div>
    <div class="qbtn" onclick="ask('What are the current global stock market indices? Show Nasdaq, S&P 500, Dow Jones, Nifty 50, BSE Sensex, Nikkei, FTSE.')">📈 Stock Markets</div>
    <div class="qbtn" onclick="ask('What is the current price of Bitcoin, Ethereum, and top cryptocurrencies?')">₿ Crypto Prices</div>
    <div class="qbtn" onclick="ask('Give me the top 5 science and technology news today.')">🔬 Tech News</div>
    <div class="qbtn" onclick="ask('What is the current geopolitical situation around the world? Any conflicts or major diplomatic events?')">🌍 World Affairs</div>
    <div class="qbtn" onclick="ask('What are the top sports news and results today?')">⚽ Sports</div>
    <div class="qbtn" onclick="ask('What is the current USD to INR exchange rate and other major currency pairs?')">💱 Forex</div>
  </div>

  <!-- Input bar -->
  <div id="inputBar">
    <input id="textInput" type="text" placeholder="Ask JARVIS anything... (news, weather, stocks, world events)" onkeydown="if(event.key==='Enter')sendText()">
    <button class="icon-btn" id="micBtn" onclick="toggleMic()" title="Voice input">🎤</button>
    <button class="icon-btn" id="sendBtn" onclick="sendText()" title="Send">➤</button>
  </div>

  <!-- Conversation -->
  <div id="convo"></div>
</div>

<!-- Status bar -->
<div id="statusBar">
  <div class="status-item"><div class="dot-live"></div><span id="stModel">JARVIS v1.0</span></div>
  <div class="status-item">🔊 <span id="stVoice">Voice: Ready</span></div>
  <div class="status-item">🌐 <span id="stWeb">Web Search: Active</span></div>
  <div class="status-item">🕐 <span id="stTime">--:--</span></div>
</div>

<script>
// ── Background canvas grid ─────────────────────────────
const bgC = document.getElementById('bgCanvas');
const bgCtx = bgC.getContext('2d');
function drawGrid() {
  bgC.width = window.innerWidth; bgC.height = window.innerHeight;
  bgCtx.clearRect(0,0,bgC.width,bgC.height);
  bgCtx.strokeStyle = '#0a3a5a';
  bgCtx.lineWidth = 0.5;
  const sz = 40;
  for(let x=0;x<bgC.width;x+=sz){bgCtx.beginPath();bgCtx.moveTo(x,0);bgCtx.lineTo(x,bgC.height);bgCtx.stroke();}
  for(let y=0;y<bgC.height;y+=sz){bgCtx.beginPath();bgCtx.moveTo(0,y);bgCtx.lineTo(bgC.width,y);bgCtx.stroke();}
}
drawGrid();
window.addEventListener('resize', drawGrid);

// ── Clock ──────────────────────────────────────────────
function updateClock() {
  const now = new Date();
  const d = now.toLocaleDateString('en-IN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'});
  const t = now.toLocaleTimeString('en-IN',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
  document.getElementById('clock').innerHTML = `${d}<br>${t}`;
  document.getElementById('stTime').textContent = t;
}
updateClock(); setInterval(updateClock,1000);

// ── API key ────────────────────────────────────────────
let apiKey = '';
function saveKey() {
  const val = document.getElementById('apiKeyInput').value.trim();
  if (!val.startsWith('sk-')) { alert('Invalid key. Must start with sk-'); return; }
  apiKey = val;
  document.getElementById('apiKeyWrap').style.display = 'none';
  document.getElementById('apiNotice').style.display = 'block';
  setTimeout(()=>document.getElementById('apiNotice').style.display='none', 4000);
  speak('JARVIS online. How can I assist you?');
  setOrbState('ready');
}

// ── Orb state ──────────────────────────────────────────
function setOrbState(state) {
  const orb = document.getElementById('orb');
  const label = document.getElementById('orbState');
  const icon = document.getElementById('orbIcon');
  orb.className = '';
  orb.classList.add(state);
  const map = {
    ready:    ['🤖','standby'],
    listening:['🎙️','listening'],
    thinking: ['⚡','processing'],
    speaking: ['🔊','speaking'],
  };
  const [ic, lb] = map[state]||['🤖','standby'];
  icon.textContent = ic; label.textContent = lb;
}

// ── Voice recognition ──────────────────────────────────
let recognition = null;
let isListening = false;

function initSpeechRecog() {
  if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) return null;
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  const rec = new SR();
  rec.continuous = false;
  rec.interimResults = true;
  rec.lang = 'en-IN';
  rec.onstart = () => {
    isListening = true;
    setOrbState('listening');
    document.getElementById('micBtn').classList.add('active');
    document.getElementById('voiceWave').classList.add('active');
    document.getElementById('stVoice').textContent = 'Voice: Listening...';
  };
  rec.onresult = (e) => {
    let transcript = '';
    for (let i=e.resultIndex;i<e.results.length;i++) {
      transcript += e.results[i][0].transcript;
    }
    document.getElementById('textInput').value = transcript;
    if (e.results[e.results.length-1].isFinal) {
      stopMic();
      ask(transcript);
    }
  };
  rec.onerror = (e) => { stopMic(); addMsg('ai','Voice error: '+e.error+'. Please type your query instead.'); };
  rec.onend = () => { stopMic(); };
  return rec;
}

function toggleMic() {
  if (!apiKey) { alert('Please enter your Anthropic API key first.'); return; }
  if (isListening) { stopMic(); return; }
  if (!recognition) recognition = initSpeechRecog();
  if (!recognition) { addMsg('ai','Voice recognition not supported in this browser. Please use Chrome.'); return; }
  recognition.start();
}

function stopMic() {
  isListening = false;
  if (recognition) try { recognition.stop(); } catch(e){}
  document.getElementById('micBtn').classList.remove('active');
  document.getElementById('voiceWave').classList.remove('active');
  document.getElementById('stVoice').textContent = 'Voice: Ready';
  if (!document.getElementById('orb').classList.contains('thinking') &&
      !document.getElementById('orb').classList.contains('speaking')) {
    setOrbState('ready');
  }
}

// ── Text to speech ─────────────────────────────────────
function speak(text) {
  if (!window.speechSynthesis) return;
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.rate = 1.05; utter.pitch = 0.9; utter.volume = 1;
  // Try to find a good voice
  const voices = window.speechSynthesis.getVoices();
  const preferred = voices.find(v=>v.name.includes('Google UK English Male')) ||
                    voices.find(v=>v.name.includes('Microsoft David')) ||
                    voices.find(v=>v.lang==='en-GB') ||
                    voices.find(v=>v.lang.startsWith('en'));
  if (preferred) utter.voice = preferred;
  utter.onstart  = ()=>setOrbState('speaking');
  utter.onend    = ()=>setOrbState('ready');
  utter.onerror  = ()=>setOrbState('ready');
  window.speechSynthesis.speak(utter);
}

// ── Send text ──────────────────────────────────────────
function sendText() {
  const val = document.getElementById('textInput').value.trim();
  if (!val) return;
  document.getElementById('textInput').value = '';
  ask(val);
}

// ── Core ask function ──────────────────────────────────
async function ask(query) {
  if (!apiKey) { alert('Please enter your Anthropic API key first.'); return; }
  if (!query.trim()) return;

  addMsg('user', query);
  showTyping();
  setOrbState('thinking');

  const systemPrompt = `You are JARVIS, an advanced AI assistant like Iron Man's JARVIS. You have access to web search for real-time data.

Your capabilities:
- Real-time news from around the world
- Global stock market data (indices, individual stocks)  
- Cryptocurrency prices
- Weather information for any city
- Breaking news and world affairs
- Sports scores and updates
- Forex/currency exchange rates
- Science & technology updates
- Political and geopolitical analysis

Response style:
- Be concise but comprehensive
- Use structured data when showing stocks/crypto/weather
- Format: use [CARD:label|value|subtext] for metric cards (e.g. [CARD:S&P 500|5,234|+1.2%])
- Format: use [NEWS:source|headline] for news items
- Speak like JARVIS — professional, intelligent, slightly formal
- Always mention that data is real-time searched
- If asked about weather, provide temperature, condition, humidity
- For stocks, always show change % and direction
- Keep spoken summary short (1-2 sentences) then show detailed cards/news

Current date/time: ${new Date().toLocaleString('en-IN', {timeZone:'Asia/Kolkata'})} IST
User location context: Jaipur, India`;

  try {
    const res = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': apiKey,
        'anthropic-version': '2023-06-01',
        'anthropic-beta': 'interleaved-thinking-2025-05-14'
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 2000,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }],
        system: systemPrompt,
        messages: [{ role: 'user', content: query }]
      })
    });

    const data = await res.json();
    hideTyping();

    if (data.error) { 
      addMsg('ai', '⚠️ API Error: ' + data.error.message);
      setOrbState('ready');
      return; 
    }

    const fullText = data.content
      .filter(b => b.type === 'text')
      .map(b => b.text)
      .join('\n');

    if (fullText) {
      renderResponse(fullText);
      // Speak a short version
      const spoken = fullText.replace(/\[CARD:[^\]]+\]/g,'').replace(/\[NEWS:[^\]]+\]/g,'').replace(/\*\*/g,'').replace(/#+/g,'').trim().slice(0,300);
      speak(spoken);
    }
    setOrbState('speaking');

  } catch(e) {
    hideTyping();
    addMsg('ai', '⚠️ Connection error. Check your API key and internet connection.\n\nError: ' + e.message);
    setOrbState('ready');
  }
}

// ── Render response (parse cards and news) ─────────────
function renderResponse(text) {
  const lines = text.split('\n');
  let html = '';
  let cards = [];
  let newsItems = [];
  let regularText = '';

  const flushText = () => {
    if (regularText.trim()) {
      html += `<div style="margin-bottom:8px">${md(regularText.trim())}</div>`;
      regularText = '';
    }
  };
  const flushCards = () => {
    if (cards.length) {
      html += `<div class="cards-row">` + cards.join('') + `</div>`;
      cards = [];
    }
  };
  const flushNews = () => {
    if (newsItems.length) {
      html += `<div style="margin-top:8px">` + newsItems.join('') + `</div>`;
      newsItems = [];
    }
  };

  for (const line of lines) {
    const cardMatch = line.match(/\[CARD:([^\|]+)\|([^\|]+)\|?([^\]]*)\]/g);
    const newsMatch = line.match(/\[NEWS:([^\|]+)\|([^\]]+)\]/);

    if (cardMatch) {
      flushText(); flushNews();
      for (const cm of cardMatch) {
        const m = cm.match(/\[CARD:([^\|]+)\|([^\|]+)\|?([^\]]*)\]/);
        if (m) {
          const [,label,val,sub] = m;
          const updown = sub.includes('+') ? 'up' : sub.includes('-') ? 'down' : '';
          cards.push(`<div class="card ${updown}"><div class="card-label">${label}</div><div class="card-val">${val}</div><div class="card-sub">${sub}</div></div>`);
        }
      }
    } else if (newsMatch) {
      flushText(); flushCards();
      const [,src,title] = newsMatch;
      newsItems.push(`<div class="news-item"><div class="news-src">${src}</div><div class="news-title">${title}</div></div>`);
    } else {
      flushCards(); flushNews();
      regularText += line + '\n';
    }
  }
  flushText(); flushCards(); flushNews();

  addMsgHTML('ai', html);
}

function md(text) {
  return text
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
    .replace(/\*(.+?)\*/g, '<em>$1</em>')
    .replace(/`(.+?)`/g, `<code style="background:#0a2030;padding:1px 5px;border-radius:3px;font-family:'Share Tech Mono',monospace;font-size:12px">$1</code>`)
    .replace(/^#{1,3}\s(.+)$/gm, '<div style="font-size:15px;font-weight:600;color:#00d4ff;margin:8px 0 4px">$1</div>')
    .replace(/\n/g, '<br>');
}

// ── Message helpers ────────────────────────────────────
let typingEl = null;

function addMsg(role, text) {
  addMsgHTML(role, `<span>${md(text)}</span>`);
}

function addMsgHTML(role, html) {
  const convo = document.getElementById('convo');
  const div = document.createElement('div');
  div.className = `msg ${role==='user'?'user':'ai'}`;
  const avatarClass = role==='user'?'usr':'ai';
  const avatarIcon  = role==='user'?'👤':'🤖';
  div.innerHTML = `
    <div class="avatar ${avatarClass}">${avatarIcon}</div>
    <div class="bubble">${html}</div>
  `;
  convo.appendChild(div);
  div.scrollIntoView({behavior:'smooth',block:'end'});
}

function showTyping() {
  const convo = document.getElementById('convo');
  typingEl = document.createElement('div');
  typingEl.className = 'msg ai';
  typingEl.innerHTML = `<div class="avatar ai">🤖</div><div class="bubble"><div class="typing"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div></div>`;
  convo.appendChild(typingEl);
  typingEl.scrollIntoView({behavior:'smooth',block:'end'});
}

function hideTyping() {
  if (typingEl) { typingEl.remove(); typingEl=null; }
}

// ── Welcome message ─────────────────────────────────────
addMsgHTML('ai', `
  <div style="margin-bottom:8px"><strong style="color:#00d4ff">JARVIS Online.</strong> Good ${getTimeGreeting()}, AK.</div>
  <div style="font-size:13px;color:#88aabb;margin-bottom:10px">I can fetch real-time information about:</div>
  <div style="display:flex;flex-wrap:wrap;gap:6px;font-size:11px;font-family:'Share Tech Mono',monospace">
    ${['📰 Breaking News','📈 Stock Markets','🌤 Weather','₿ Crypto','🌍 World Affairs','💱 Forex','⚽ Sports','🔬 Tech News'].map(x=>`<span style="background:#020f1c;border:1px solid #0a3a5a;border-radius:4px;padding:3px 8px;color:#3a8aaa">${x}</span>`).join('')}
  </div>
  <div style="margin-top:10px;font-size:12px;color:#3a6a8a">→ Enter your Anthropic API key above to activate voice + AI search</div>
`);

function getTimeGreeting() {
  const h = new Date().getHours();
  return h<12?'morning':h<17?'afternoon':'evening';
}
